name: publish

# 本仓库目前不自动发布。
# 只在 Actions 页面手动触发（Run workflow），默认 dry_run 只做检查和打包预览。
# 以后要真正发布到 npm，先配好仓库 Secret NPM_TOKEN（或 npm Trusted Publishing），
# 再取消勾选 dry_run 运行。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只验证：跑检查并打印 npm pack 的内容，不发布'
        type: boolean
        default: true

permissions:
  contents: read
  # --provenance 需要把 GitHub 的 OIDC 令牌交给 npm 生成来源证明
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate sources
        run: |
          set -euo pipefail
          node --check index.js
          node --check client.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json','utf8'))"

      - name: Show packed contents
        run: npm pack --dry-run

      - name: Publish
        if: inputs.dry_run != true
        env:
          # 需要先在仓库 Settings → Secrets and variables → Actions 里新建 NPM_TOKEN。
          # 若改用 npm Trusted Publishing（OIDC，无需长期令牌）：
          #   1) npmjs.com → 包 → Settings → Trusted Publishing 绑定本仓库与 publish.yml
          #   2) 删掉下面的 env 与 setup-node 的 registry-url
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance
